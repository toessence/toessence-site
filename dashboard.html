
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>toEssence · Dashboard</title>
<link rel="icon" type="image/png" sizes="48x48" href="icons/icon48.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon16.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080a0f;--bg2:#ffffff;--bg3:#f4f6f8;
  --border:rgba(255,255,255,.06);--gborder:rgba(34,197,94,.2);
  --text:#d8d8d0;--muted:#52596a;--green:#22c55e;--red:#f87171;
  --card-text:#111827;--card-muted:#6b7280;--card-border:#e5e7eb;
}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-weight:300;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--green);text-decoration:none}

nav{padding:0 48px;height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.logo{font-family:'Playfair Display',serif;font-size:20px;color:#fff;letter-spacing:-.01em}
.logo em{color:var(--green);font-style:normal}
.logo-icon em{color:var(--green);font-style:normal}
.nav-right{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

.main{max-width:1100px;margin:0 auto;padding:40px 24px;flex:1;width:100%}

h2{font-family:'Playfair Display',serif;font-size:28px;font-weight:400;color:#fff;margin-bottom:32px}

/* Cards — світлі */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
@media(max-width:768px){.cards{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.cards{grid-template-columns:1fr}}

.card{background:var(--bg2);border:1px solid var(--card-border);border-radius:14px;padding:24px;color:var(--card-text)}
.card.green{border-color:var(--green);background:#f0fdf4}
.card-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--card-muted);margin-bottom:12px}
.card-val{font-family:'Playfair Display',serif;font-size:38px;color:var(--card-text);line-height:1}
.card-val.green{color:var(--green)}
.card-sub{font-size:11px;color:var(--card-muted);margin-top:6px}

/* Types bar — світлий */
.types{background:var(--bg2);border:1px solid var(--card-border);border-radius:14px;padding:24px;margin-bottom:32px;color:var(--card-text)}
.type-row{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.type-row:last-child{margin-bottom:0}
.type-name{font-size:12px;width:80px;flex-shrink:0;color:var(--card-text)}
.type-bar-wrap{flex:1;height:6px;background:rgba(0,0,0,.06);border-radius:3px;overflow:hidden}
.type-bar{height:100%;border-radius:3px;transition:width .6s ease}
.type-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--card-muted);width:60px;text-align:right;flex-shrink:0}

/* Tables — світлі */
.tables{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:32px}
@media(max-width:640px){.tables{grid-template-columns:1fr}}

.table-box{background:var(--bg2);border:1px solid var(--card-border);border-radius:14px;padding:24px;color:var(--card-text)}
.table-title{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--card-muted);margin-bottom:16px}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 0;font-size:12px;border-bottom:1px solid var(--card-border);color:var(--card-text)}
th{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;color:var(--card-muted);text-transform:uppercase;font-weight:400}
tr:last-child td{border-bottom:none}
td:last-child,th:last-child{text-align:right;color:var(--green);font-family:'IBM Plex Mono',monospace}

/* Loading */
.loading{text-align:center;padding:60px;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:12px}
.spin{display:inline-block;width:20px;height:20px;border-radius:50%;border:2px solid rgba(34,197,94,.2);border-top-color:var(--green);animation:spin .7s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}

.refresh{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);cursor:pointer;letter-spacing:.05em;background:none;border:1px solid var(--border);padding:6px 12px;border-radius:6px;transition:all .2s}
.refresh:hover{color:var(--green);border-color:var(--gborder)}

/* Footer — адаптивний */
footer{border-top:1px solid var(--border);padding:16px 48px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;text-align:center}
@media(max-width:600px){footer{padding:16px 24px;font-size:10px}}
</style>
</head>
<body>

<nav>
  <a class="logo" href="https://toessence.net/">to<em>E</em>ssence</a>
  <div style="display:flex;align-items:center;gap:16px">
    <span class="nav-right" id="lastUpdate">Завантаження...</span>
    <button class="refresh" onclick="loadData()">↻ Оновити</button>
  </div>
</nav>

<div class="main">
  <h2>Dashboard</h2>
  <div id="content">
    <div class="loading">
      <div class="spin"></div><br>Завантаження даних...
    </div>
  </div>
</div>

<footer>© 2026 toessence.net · Admin Dashboard</footer>

<script>
const PWD = 'toe2026admin' // ← змінити на свій пароль
const saved = sessionStorage.getItem('toe_dash_auth')
if (saved !== PWD) {
  const input = prompt('Пароль:')
  if (input !== PWD) {
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:monospace;color:#f87171;background:#080a0f">Доступ заборонено</div>'
    throw new Error('Unauthorized')
  }
  sessionStorage.setItem('toe_dash_auth', PWD)
}

const SUPABASE_URL = 'https://xstqpvvxiftgppxnzpzv.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzdHFwdnZ4aWZ0Z3BweG56cHp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1Nzk2NjcsImV4cCI6MjA5NDE1NTY2N30.g4yGHVjyjBJhZw6VjpGHMJTQ7AGHHoxahYhVDSOMhTg' // ← вставити anon key

async function loadData() {
  document.getElementById('lastUpdate').textContent = 'Оновлення...'

  const today = new Date().toISOString().split('T')[0]
  const monthStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString()

  const h = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
  const hc = { ...h, Prefer: 'count=exact', 'Range-Unit': 'items', Range: '0-0' }

  const [totalRes, todayRes, monthRes, typesRes, countriesRes, sitesRes, usersRes, proRes] = await Promise.all([
    fetch(SUPABASE_URL + '/rest/v1/filters?select=count', { headers: hc }),
    fetch(SUPABASE_URL + '/rest/v1/filters?select=count&created_at=gte.' + today + 'T00:00:00', { headers: hc }),
    fetch(SUPABASE_URL + '/rest/v1/filters?select=count&created_at=gte.' + monthStart, { headers: hc }),
    fetch(SUPABASE_URL + '/rest/v1/filters?select=type', { headers: h }),
    fetch(SUPABASE_URL + '/rest/v1/filters?select=country', { headers: h }),
    fetch(SUPABASE_URL + '/rest/v1/filters?select=site', { headers: h }),
    fetch(SUPABASE_URL + '/rest/v1/users?select=count', { headers: hc }),
    fetch(SUPABASE_URL + '/rest/v1/users?select=count&is_pro=eq.true', { headers: hc }),
  ])

  const total      = parseInt(totalRes.headers.get('content-range')?.split('/')[1] || 0)
  const todayCount = parseInt(todayRes.headers.get('content-range')?.split('/')[1] || 0)
  const monthCount = parseInt(monthRes.headers.get('content-range')?.split('/')[1] || 0)
  const totalUsers = parseInt(usersRes.headers.get('content-range')?.split('/')[1] || 0)
  const proUsers   = parseInt(proRes.headers.get('content-range')?.split('/')[1] || 0)

  const typesData     = await typesRes.json()
  const countriesData = await countriesRes.json()
  const sitesData     = await sitesRes.json()

  const types = {}
  typesData.forEach(r => { types[r.type] = (types[r.type] || 0) + 1 })
  const typeMax = Math.max(...Object.values(types), 1)

  const countries = {}
  countriesData.forEach(r => { if(r.country) countries[r.country] = (countries[r.country] || 0) + 1 })
  const topCountries = Object.entries(countries).sort((a,b) => b[1]-a[1]).slice(0, 8)

  const sites = {}
  sitesData.forEach(r => { if(r.site && r.site !== 'unknown') sites[r.site] = (sites[r.site] || 0) + 1 })
  const topSites = Object.entries(sites).sort((a,b) => b[1]-a[1]).slice(0, 8)

  const typeLabels = { news: 'Новини', youtube: 'YouTube', google: 'Google', reviews: 'Відгуки' }
  const typeColors = { news: '#22c55e', youtube: '#ef4444', google: '#4285F4', reviews: '#f59e0b' }

  document.getElementById('content').innerHTML = `
    <div class="cards">
      <div class="card green">
        <div class="card-lbl">Фільтрів сьогодні</div>
        <div class="card-val green">${todayCount.toLocaleString()}</div>
        <div class="card-sub">за поточну добу</div>
      </div>
      <div class="card">
        <div class="card-lbl">Фільтрів цього місяця</div>
        <div class="card-val">${monthCount.toLocaleString()}</div>
        <div class="card-sub">з початку місяця</div>
      </div>
      <div class="card">
        <div class="card-lbl">Всього фільтрів</div>
        <div class="card-val">${total.toLocaleString()}</div>
        <div class="card-sub">за весь час</div>
      </div>
      <div class="card">
        <div class="card-lbl">Всього користувачів</div>
        <div class="card-val">${totalUsers.toLocaleString()}</div>
        <div class="card-sub">зареєстровано</div>
      </div>
      <div class="card green">
        <div class="card-lbl">Pro користувачів</div>
        <div class="card-val green">${proUsers.toLocaleString()}</div>
        <div class="card-sub">${totalUsers ? Math.round(proUsers/totalUsers*100) : 0}% від усіх</div>
      </div>
      <div class="card">
        <div class="card-lbl">Free користувачів</div>
        <div class="card-val">${(totalUsers - proUsers).toLocaleString()}</div>
        <div class="card-sub">без підписки</div>
      </div>
    </div>

    <div class="types">
      <div class="table-title">Розбивка по типах</div>
      ${Object.entries(types).sort((a,b)=>b[1]-a[1]).map(([type, count]) => `
        <div class="type-row">
          <span class="type-name">${typeLabels[type] || type}</span>
          <div class="type-bar-wrap">
            <div class="type-bar" style="width:${Math.round(count/typeMax*100)}%;background:${typeColors[type]||'#22c55e'}"></div>
          </div>
          <span class="type-count">${count.toLocaleString()}</span>
        </div>
      `).join('')}
    </div>

    <div class="tables">
      <div class="table-box">
        <div class="table-title">Топ країн</div>
        <table>
          <tr><th>Країна</th><th>Фільтрів</th></tr>
          ${topCountries.map(([c,n]) => `<tr><td>${c}</td><td>${n.toLocaleString()}</td></tr>`).join('')}
        </table>
      </div>
      <div class="table-box">
        <div class="table-title">Топ сайтів</div>
        <table>
          <tr><th>Сайт</th><th>Фільтрів</th></tr>
          ${topSites.map(([s,n]) => `<tr><td>${s}</td><td>${n.toLocaleString()}</td></tr>`).join('')}
        </table>
      </div>
    </div>
  `

  document.getElementById('lastUpdate').textContent = 'Оновлено: ' + new Date().toLocaleTimeString('uk')
}

loadData()
</script>
</body>
</html>
