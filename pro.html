<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080a0f;--bg2:#0d1018;--border:rgba(255,255,255,.06);--text:#d8d8d0;--muted:#52596a;--green:#22c55e;--gdim:rgba(34,197,94,.08);--gborder:rgba(34,197,94,.22)}
html{-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-weight:300;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}

nav{padding:0 48px;height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}

.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:48px 24px}
.slogan{font-family:'Playfair Display',serif;font-size:64px;font-weight:400;color:#fff;text-align:center;margin-bottom:48px;letter-spacing:-.01em}
.card{background:var(--bg2);border:1px solid var(--gborder);border-radius:16px;padding:48px;max-width:480px;width:100%;text-align:center}

.badge{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);border:1px solid var(--gborder);padding:5px 14px;border-radius:16px;display:inline-block;margin-bottom:24px}

.price-sub{font-size:14px;color:var(--muted);margin-bottom:32px;line-height:1.6}

.price-display{background:rgba(34,197,94,.06);border:1px solid var(--gborder);border-radius:10px;padding:20px;margin-bottom:28px}
.price-amount{font-family:'Playfair Display',serif;font-size:48px;color:#fff;line-height:1}
.price-period{font-size:13px;color:var(--muted);margin-top:4px}
.price-note{font-size:11px;color:rgba(34,197,94,.6);margin-top:8px;font-family:'IBM Plex Mono',monospace;letter-spacing:.05em}

.features{text-align:left;display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.feature{display:flex;gap:10px;align-items:center;font-size:13px;color:rgba(255,255,255,.7)}
.feature::before{content:'✓';color:var(--green);font-size:12px;flex-shrink:0;font-weight:600}

<script>
// Get UUID from URL params (passed from extension)
const params = new URLSearchParams(location.search);
const uuid = params.get('uuid') || '';
const country = params.get('country') || '';
const plan = params.get('plan') || 'pro'; // 'easy' або 'pro'

function getPricing(c) {
  const entry = pricing[c] || pricing['DEFAULT'] || { amount: '2', currency: '€' };
  // Якщо є розбивка easy/pro
  if (entry.easy && entry.pro) return plan === 'easy' ? entry.easy : entry.pro;
  return entry;
}

function applyPricing(c) {
  const p = getPricing(c);
  document.getElementById('priceAmount').innerHTML = p.amount + '<span style="font-size:22px;color:var(--muted)">' + p.currency + '/місяць</span>';
  window._currentPricing = p;
}

// Якщо country не передано в URL — визначаємо по IP
if (!country) {
  fetch('https://ipapi.co/json/')
    .then(r => r.json())
    .then(d => { applyPricing(d.country_code || 'UA') })
    .catch(() => { applyPricing('UA') });
} else {
  applyPricing(country);
}

const pricing = {
  UA: { easy: { amount: '2', currency: '€' }, pro: { amount: '5', currency: '€' } },
  DEFAULT: { easy: { amount: '2', currency: '€' }, pro: { amount: '5', currency: '€' } }
};

const p = pricing[country] || { amount: '2', currency: '€' };

document.getElementById('priceAmount').innerHTML = p.amount + '<span style="font-size:22px;color:var(--muted)">' + p.currency + '/місяць</span>';


async function startCheckout() {
  const btn = document.getElementById('checkoutBtn')
  btn.textContent = 'Завантаження...'
  btn.disabled = true

  // Беремо uuid з chrome storage якщо доступний
  let uuid = localStorage.getItem('toe_uuid') || 'web_' + Math.random().toString(36).slice(2)

  try {
    const res = await fetch('https://xstqpvvxiftgppxnzpzv.supabase.co/functions/v1/create-checkout', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzdHFwdnZ4aWZ0Z3BweG56cHp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1Nzk2NjcsImV4cCI6MjA5NDE1NTY2N30.g4yGHVjyjBJhZw6VjpGHMJTQ7AGHHoxahYhVDSOMhTg'
      },
      body: JSON.stringify({ uuid, plan })
    })
    const data = await res.json()
    if (data.url) {
      window.location.href = data.url
    } else {
      throw new Error(data.error || 'Помилка')
    }
  } catch (e) {
    btn.textContent = 'Помилка. Спробуй знову'
    btn.disabled = false
  }
}
</script>
