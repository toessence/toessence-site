const uuid = params.get('uuid') || '';
const country = params.get('country') || '';
const plan = params.get('plan') || 'pro'; // 'easy' або 'pro'

function getPricing(c) {
  const entry = pricing[c] || pricing['DEFAULT'] || { amount: '2', currency: '$', stripePrice: 'price_DEFAULT_PLACEHOLDER' };
  // Якщо є розбивка easy/pro
  if (entry.easy && entry.pro) return plan === 'easy' ? entry.easy : entry.pro;
  return entry;
}

function applyPricing(c) {
  const p = getPricing(c);
  document.getElementById('priceAmount').innerHTML = p.amount + '<span style="font-size:22px;color:var(--muted)">' + p.currency + '/місяць</span>';
  window._currentPricing = p;
}

// Якщо country не передано в URL — визначаємо по IP
if (!country) {
  fetch('https://ipapi.co/json/')
    .then(r => r.json())
    .then(d => { applyPricing(d.country_code || 'UA') })
    .catch(() => { applyPricing('UA') });
} else {
  applyPricing(country);
}

async function startCheckout() {
  const btn = document.getElementById('checkoutBtn')
  btn.textContent = 'Завантаження...'
  btn.disabled = true

  // Беремо uuid з chrome storage якщо доступний
  let uuid = localStorage.getItem('toe_uuid') || ''

  try {
    const res = await fetch('https://xstqpvvxiftgppxnzpzv.supabase.co/functions/v1/create-checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uuid, plan })
    })
    const data = await res.json()
    if (data.url) {
      window.location.href = data.url
    } else {
      throw new Error(data.error || 'Помилка')
    }
  } catch (e) {
    btn.textContent = 'Помилка. Спробуй знову'
    btn.disabled = false
  }
  return // старий код нижче не виконується
  const btn = document.getElementById('checkoutBtn');
  btn.textContent = 'Перенаправляємо на оплату...';
  btn.disabled = true;

  try {
    // Call your backend to create Stripe Checkout session
    const resp = await fetch('https://xstqpvvxiftgppxnzpzv.supabase.co/functions/v1/create-checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uuid, country, plan, priceId: (window._currentPricing || {}).stripePrice || 'price_DEFAULT_PLACEHOLDER' }),
    });
    const data = await resp.json();
    if (data.url) {
      window.location.href = data.url;
    } else {
      throw new Error('No checkout URL');
    }
  } catch (e) {
    btn.textContent = 'Оформити Pro підписку';

    alert('Помилка. Спробуйте ще раз.');
  }
}
