<script>
// Get UUID from URL params (passed from extension)
const params = new URLSearchParams(location.search);
const uuid = params.get('uuid') || '';
const country = params.get('country') || '';
const plan = params.get('plan') || 'pro';
// Мова з localStorage (та сама що на головній)
const _lang = localStorage.getItem('toe_lang') || 'en';
const T = {
  uk: {
    back: '← повернутись', period: '/місяць',
    f2: 'Будь-який сайт', f3: 'Персональна ліцензія', f4: 'Мультимовність',
    f5: 'Скасування підписки в будь-який момент',
    btn: 'Оформити підписку',
    secure: 'Безпечна оплата <span>Paddle</span> · Картка, Google Pay, Apple Pay',
    filters: (n) => n + ' фільтрів на день'
  },
  en: {
    back: '← back', period: '/mo',
    f2: 'Any website', f3: 'Personal license', f4: 'Multilingual',
    f5: 'Cancel anytime',
    btn: 'Subscribe',
    secure: 'Secure payment <span>Paddle</span> · Card, Google Pay, Apple Pay',
    filters: (n) => n + ' filters per day'
  }
};
const tr = T[_lang] || T.en;
document.addEventListener('DOMContentLoaded', () => {
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  set('t-back', tr.back);
  set('t-period', tr.period);
  set('t-f2', tr.f2); set('t-f3', tr.f3); set('t-f4', tr.f4); set('t-f5', tr.f5);
  set('t-btn', tr.btn);
  const sec = document.getElementById('t-secure'); if (sec) sec.innerHTML = tr.secure;
  const ff = document.getElementById('filtersFeature'); if (ff) ff.textContent = tr.filters(plan === 'easy' ? '50' : '150');
});

// Оновлюємо ціну/період в price-display
document.addEventListener('DOMContentLoaded', () => {
  const el = document.getElementById('planPrice'); if (el) el.textContent = plan === 'easy' ? '€2' : '€5';
});

function getPricing(c) {
  const entry = pricing[c] || pricing['DEFAULT'] || { amount: '2', currency: '€' };
  // Якщо є розбивка easy/pro
  if (entry.easy && entry.pro) return plan === 'easy' ? entry.easy : entry.pro;
  return entry;
}

function applyPricing(c) {
  const p = getPricing(c);
  document.getElementById('priceAmount').innerHTML = p.amount + '<span style="font-size:22px;color:var(--muted)">' + p.currency + tr.period + '</span>';
  window._currentPricing = p;
}

// Якщо country не передано в URL — визначаємо по IP
if (!country) {
  applyPricing('DEFAULT');
} else {
  applyPricing(country);
}

const pricing = {
  UA: { easy: { amount: '2', currency: '€' }, pro: { amount: '5', currency: '€' } },
  DEFAULT: { easy: { amount: '2', currency: '€' }, pro: { amount: '5', currency: '€' } }
};

const p = pricing[country] || { amount: '2', currency: '€' };

document.getElementById('priceAmount').innerHTML = p.amount + '<span style="font-size:22px;color:var(--muted)">' + p.currency + tr.period + '</span>';


async function startCheckout() {
  const btn = document.getElementById('checkoutBtn')
  btn.textContent = 'Завантаження...'
  btn.disabled = true

  // uuid приходить з розширення через URL (?uuid=...). Якщо нема — генеруємо web-варіант.
  const uuid = params.get('uuid') || ('web_' + Math.random().toString(36).slice(2))

  try {
    const res = await fetch('https://xstqpvvxiftgppxnzpzv.supabase.co/functions/v1/create-checkout', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzdHFwdnZ4aWZ0Z3BweG56cHp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1Nzk2NjcsImV4cCI6MjA5NDE1NTY2N30.g4yGHVjyjBJhZw6VjpGHMJTQ7AGHHoxahYhVDSOMhTg'
      },
      body: JSON.stringify({ uuid, plan })
    })
    const data = await res.json()
    if (data.transactionId) {
      // Відкриваємо Paddle overlay-checkout за ID транзакції
      Paddle.Checkout.open({ transactionId: data.transactionId })
      btn.textContent = tr.btn
      btn.disabled = false
    } else {
      throw new Error(data.error || 'Помилка')
    }
  } catch (e) {
    btn.textContent = 'Помилка. Спробуй знову'
    btn.disabled = false
  }
}
</script>
