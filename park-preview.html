<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>toEssence — ескіз (ліс)</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#f4f8ee;
  --lime:#c3e85f;      /* сонячний акцент із фото */
  --grass:#8ed24e;
  --leaf:#5aa832;
  --shadow:#0a1606;
  --f-serif:'Playfair Display',Georgia,serif;
  --f-sans:'IBM Plex Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',monospace;
}
html,body{height:100%}
body{
  font-family:var(--f-sans);color:var(--ink);font-weight:300;min-height:100vh;overflow-x:hidden;
  background:#0e1a0b url('./park-bg.jpg') center center / cover no-repeat fixed;
}
/* читабельність тексту поверх фото */
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;background:
  radial-gradient(62% 52% at 50% 43%, rgba(6,14,4,.62) 0%, rgba(6,14,4,0) 68%),
  linear-gradient(180deg, rgba(6,14,4,.62) 0%, rgba(6,14,4,.06) 26%, rgba(6,14,4,.12) 58%, rgba(6,14,4,.8) 100%);}
.wrap{position:relative;z-index:2}

/* NAV */
nav{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;height:64px}
.logo{font-family:var(--f-serif);font-size:23px;font-weight:600;letter-spacing:.01em;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.logo em{font-style:normal;color:var(--lime)}
.nav-right{display:flex;align-items:center;gap:20px}
.nav-links{display:flex;gap:26px;font-size:14px;color:rgba(244,248,238,.85)}
.nav-links a{text-decoration:none;color:inherit;transition:color .2s;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.nav-links a:hover{color:var(--lime)}
.lang{display:flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:11px}
.lang button{background:none;border:none;cursor:pointer;color:rgba(244,248,238,.7);padding:5px 8px;font-family:inherit;font-size:11px}
.lang button.active{color:var(--lime)}

/* HERO */
.hero{min-height:calc(100vh - 64px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px 80px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--lime);
  margin-bottom:26px;text-shadow:0 2px 14px rgba(0,0,0,.7)}
h1{font-family:var(--f-serif);font-weight:500;font-size:clamp(50px,9vw,108px);line-height:1.02;letter-spacing:-.015em;
  text-shadow:0 6px 44px rgba(0,0,0,.7),0 2px 10px rgba(0,0,0,.5)}
h1 em{font-style:italic;color:var(--lime)}
.lead{max-width:560px;margin:26px auto 0;font-size:19px;line-height:1.7;color:#eaf1e2;
  text-shadow:0 2px 20px rgba(0,0,0,.75)}
.lead b{font-weight:500;color:#fff}
.cta{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:38px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:14px;letter-spacing:.02em;
  padding:15px 28px;border-radius:100px;border:none;cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s}
.btn-primary{background:var(--lime);color:#1b2a0c;font-weight:600;box-shadow:0 14px 40px rgba(140,190,50,.35)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 20px 52px rgba(140,190,50,.5)}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(4px)}
.btn-ghost:hover{border-color:var(--lime);transform:translateY(-2px)}
.scroll{margin-top:54px;font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(244,248,238,.6);
  display:flex;flex-direction:column;align-items:center;gap:8px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.scroll .ln{width:1px;height:34px;background:linear-gradient(rgba(244,248,238,.7),transparent)}

@media(max-width:720px){
  nav{padding:0 20px}
  .nav-links{display:none}
}
</style>
</head>
<body>
<div class="scrim"></div>
<div class="wrap">
  <nav>
    <div class="logo">to<em>E</em>ssence</div>
    <div class="nav-right">
      <div class="nav-links">
        <a href="#">How it works</a>
        <a href="#">Pricing</a>
        <a href="#">About</a>
      </div>
      <div class="lang"><button class="active">EN</button><span style="color:rgba(255,255,255,.25)">|</span><button>UA</button></div>
    </div>
  </nav>

  <header class="hero">
    <div class="eyebrow">Clear your mind · Reclaim your time</div>
    <h1>Value Your <em>Time</em></h1>
    <p class="lead">toEssence filters the noise — clickbait, triggers, manipulation — and leaves you the essence in seconds. <b>Just hover and read.</b></p>
    <div class="cta">
      <a class="btn btn-primary" href="#">Add to Chrome — Free</a>
      <a class="btn btn-ghost" href="#">See how it works</a>
    </div>
    <div class="scroll"><span>Scroll</span><span class="ln"></span></div>
  </header>
</div>
</body>
</html>
